openapi: 3.1.0
info:
  title: Spool API
  version: 1.0.0
  description: |
    Manages a cluster of Spool nodes. A node registers with its id and its address and then sends heartbeats; one
    whose last heartbeat is older than the heartbeat timeout is down. Every route but this contract needs a caller
    identified by one of the providers of the authentication block of the API, such as HMAC_SIGNATURE or OIDC, with
    the role the route asks for: a caller nobody can identify gets 401, and one without the role 403.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: http://localhost:8090
    description: The Spool API on this machine, on the default port of server.port
paths:
  /spool/cluster/nodes:
    post:
      summary: Register a node, or register it again with a new address
      description: Needs the node role. The node is up from now.
      operationId: registerNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: The node, as the API now knows it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List the nodes of the cluster
      description: Needs the read role. Nodes come in the order they first registered.
      operationId: listNodes
      responses:
        '200':
          description: Every node the API knows
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/cluster/nodes/{id}/heartbeat:
    put:
      summary: Say that a registered node is alive
      description: Needs the node role. The request has no body.
      operationId: beat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The heartbeat was noted
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/deployments:
    get:
      summary: List the deployments with the node each runs on
      description: >
        Needs the read role. Before answering, a deployment without a node, or on a node that is down, goes to the
        live node with the fewest deployments.
      operationId: listDeployments
      responses:
        '200':
          description: Every deployment, in the order they were first sent
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/deployments/{name}:
    put:
      summary: Deploy a descriptor under a name, or a new version of the one with that name
      description: >
        Needs the deploy role. The descriptor is checked as a node would load it, and each module must have the pieces
        it needs; what only building finds, such as a type without a plugin, the node reports. It goes whole to the
        live node with the fewest deployments, or waits for one; a new version stays on its node. Its ${env:NAME} are
        read in the node.
      operationId: deploy
      parameters:
        - $ref: '#/components/parameters/DeploymentName'
      requestBody:
        required: true
        description: The descriptor, as a single YAML file without include
        content:
          application/yaml:
            schema:
              type: string
      responses:
        '201':
          description: The new deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '200':
          description: The deployment, in its new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Withdraw a deployment, so no node runs it any more
      description: Needs the deploy role.
      operationId: withdrawDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentName'
      responses:
        '204':
          description: The deployment was withdrawn
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/openapi.yaml:
    get:
      summary: This contract
      description: Open to anyone.
      operationId: contract
      security: []
      responses:
        '200':
          description: The OpenAPI contract of the Spool API
          content:
            application/yaml: {}
components:
  schemas:
    Registration:
      type: object
      required: [id, address]
      properties:
        id:
          type: string
          example: node-a
        address:
          type: string
          format: uri
          example: http://10.0.0.1:8080
    Node:
      type: object
      required: [id, address, state, lastHeartbeat]
      properties:
        id:
          type: string
        address:
          type: string
          format: uri
        state:
          type: string
          enum: [UP, DOWN]
        lastHeartbeat:
          type: string
          format: date-time
    Deployment:
      type: object
      required: [name, owner, ownerProvider, version, state]
      properties:
        name:
          type: string
          example: orders
        owner:
          type: string
          description: Who sent the last version, as the provider identified it
        ownerProvider:
          type: string
          description: The provider that identified the owner
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [ASSIGNED, WAITING]
          description: WAITING while no live node can take it
        node:
          type: [string, 'null']
          description: The node it is assigned to, null while it waits
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  parameters:
    DeploymentName:
      name: name
      in: path
      required: true
      description: The name of the deployment, chosen by whoever sends it
      schema:
        type: string
  responses:
    Error:
      description: What was wrong with the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: No provider could identify the caller
    Forbidden:
      description: The caller lacks the role of the route
