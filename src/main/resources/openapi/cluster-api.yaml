openapi: 3.1.0
info:
  title: Spool API
  version: 1.0.0
  description: |
    Manages a cluster of Spool nodes. A node registers with its id and its address and then sends heartbeats; one
    whose last heartbeat is older than the heartbeat timeout is down. Every route but this contract needs a caller
    identified by one of the providers of the authentication block of the API, such as HMAC_SIGNATURE or OIDC, with
    the role the route asks for: a caller nobody can identify gets 401, and one without the role 403.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
servers:
  - url: http://localhost:8090
    description: The Spool API on this machine, on the default port of server.port
paths:
  /spool/cluster/nodes:
    post:
      summary: Register a node, or register it again with a new address
      description: Needs the node role. The node is up from now.
      operationId: registerNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: The node, as the API now knows it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List the nodes of the cluster
      description: Needs the read role. Nodes come in the order they first registered.
      operationId: listNodes
      responses:
        '200':
          description: Every node the API knows
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/cluster/nodes/{id}/heartbeat:
    put:
      summary: Say that a registered node is alive
      description: Needs the node role. The request has no body.
      operationId: beat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The heartbeat was noted
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/cluster/nodes/{id}/assignments:
    get:
      summary: The deployments assigned to a node
      description: >
        Needs the node role. A node asks with each heartbeat, starts what it lacks, stops what it has of more and
        restarts what changed version. It stops everything once leaseSeconds pass without the API accepting a
        heartbeat. Before answering, a deployment without a node, or on a node that is down, goes to a live node.
      operationId: assignmentsOfANode
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The deployments of the node
          content:
            application/json:
              schema:
                type: object
                required: [leaseSeconds, deployments]
                properties:
                  leaseSeconds:
                    type: integer
                    description: How long the node may keep running them without the API, the heartbeat timeout
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/cluster/nodes/{id}/assignments/{name}:
    put:
      summary: Say whether a deployment assigned to the node runs or failed to start
      description: >
        Needs the node role. It counts only for the version the deployment has now and only from the node it is on.
        A deployment that failed stays on its node until a new version is sent or the node goes down.
      operationId: reportAssignment
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/DeploymentName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentReport'
      responses:
        '204':
          description: What the node said was noted
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/deployments:
    get:
      summary: List the deployments with the node each runs on
      description: >
        Needs the read role. Before answering, a deployment without a node, or on a node that is down, goes to the
        live node with the fewest deployments.
      operationId: listDeployments
      responses:
        '200':
          description: Every deployment, in the order they were first sent
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/deployments/{name}:
    put:
      summary: Deploy a descriptor under a name, or a new version of the one with that name
      description: >
        Needs the deploy role. The descriptor is checked as a node would load it, and each module must have the pieces
        it needs; what only building finds, such as a type without a plugin, the node reports. It goes whole to the
        live node with the fewest deployments, or waits for one; a new version stays on its node. Its ${env:NAME} are
        read in the node.
      operationId: deploy
      parameters:
        - $ref: '#/components/parameters/DeploymentName'
      requestBody:
        required: true
        description: >
          The pipeline: as JSON, its main file and every other file by its path relative to the main one (ADR-036);
          as YAML, a pipeline of one file, named after the deployment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineFiles'
          application/yaml:
            schema:
              type: string
      responses:
        '201':
          description: The new deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '200':
          description: The deployment, in its new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      summary: Withdraw a deployment, so no node runs it any more
      description: Needs the deploy role.
      operationId: withdrawDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentName'
      responses:
        '204':
          description: The deployment was withdrawn
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /spool/openapi.yaml:
    get:
      summary: This contract
      description: Open to anyone.
      operationId: contract
      security: []
      responses:
        '200':
          description: The OpenAPI contract of the Spool API
          content:
            application/yaml: {}
components:
  schemas:
    Registration:
      type: object
      required: [id, address]
      properties:
        id:
          type: string
          example: node-a
        address:
          type: string
          format: uri
          example: http://10.0.0.1:8080
    Node:
      type: object
      required: [id, address, state, lastHeartbeat]
      properties:
        id:
          type: string
        address:
          type: string
          format: uri
        state:
          type: string
          enum: [UP, DOWN]
        lastHeartbeat:
          type: string
          format: date-time
    Assignment:
      type: object
      required: [name, version, main, files]
      properties:
        name:
          type: string
        version:
          type: integer
          minimum: 1
        main:
          type: string
          description: The path of the main file
        files:
          type: object
          description: Every file of the pipeline, by its path, as it was sent
          additionalProperties:
            type: string
    PipelineFiles:
      type: object
      required: [main, files]
      properties:
        main:
          type: string
          example: orders.spool.yaml
        files:
          type: object
          description: Every file by its path relative to the main one, the main one included; no path may leave the pipeline
          additionalProperties:
            type: string
    AssignmentReport:
      type: object
      required: [version, state]
      properties:
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [RUNNING, FAILED]
        error:
          type: string
          description: Why it failed to start; required when the state is FAILED
    Deployment:
      type: object
      required: [name, owner, ownerProvider, version, state]
      properties:
        name:
          type: string
          example: orders
        owner:
          type: string
          description: Who sent the last version, as the provider identified it
        ownerProvider:
          type: string
          description: The provider that identified the owner
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [WAITING, STARTING, RUNNING, FAILED]
          description: WAITING while no live node can take it; otherwise what its node said of it
        node:
          type: [string, 'null']
          description: The node it is assigned to, null while it waits
        error:
          type: [string, 'null']
          description: Why it failed to start, null unless it failed
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  parameters:
    NodeId:
      name: id
      in: path
      required: true
      description: The id of the node
      schema:
        type: string
    DeploymentName:
      name: name
      in: path
      required: true
      description: The name of the deployment, chosen by whoever sends it
      schema:
        type: string
  responses:
    Error:
      description: What was wrong with the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: No provider could identify the caller
    Forbidden:
      description: The caller lacks the role of the route
